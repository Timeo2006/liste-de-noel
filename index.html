<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ma liste de Noël</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a night-green stage with a string of lights on top, a 3x3 grid of wrapped gifts (2 columns on phones), each gift opens in place to show a gift tag with the photo. */
:root {
  --night: #0d2820;
  --pine: #17402f;
  --cream: #f7eddb;
  --red: #c9232d;
  --gold: #e6b04b;
  --ink: #1b1410;
  --mist: #b9cfc4;
  --font-display: "Mountains of Christmas", "Georgia", serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--night);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, #1d5a42 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, #123629 0%, transparent 70%);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 8px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

.lights { display: flex; justify-content: space-between; padding: 0 4px; position: relative; height: 44px; }
.lights::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22px;
  border-bottom: 2px solid #0a1a15; border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.lights span {
  position: relative; width: 12px; height: 18px; border-radius: 50% 50% 55% 55%;
  margin-top: 14px; background: var(--c); box-shadow: 0 0 14px 3px var(--c);
  animation: twinkle 2.4s ease-in-out infinite; animation-delay: var(--d);
}
.lights span:nth-child(odd) { margin-top: 20px; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

header { text-align: center; padding: 20px 0 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.eyebrow { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
h1 { font-family: var(--font-display); font-size: clamp(2.8rem, 10vw, 5rem); line-height: 1; margin: 0; color: var(--cream); text-wrap: balance; text-shadow: 0 3px 0 var(--red); }
.lead { max-width: 44ch; margin: 0; color: var(--mist); font-size: 1.05rem; }

.status { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 16px; margin: 6px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.status .pill { background: var(--pine); border: 1px solid #2c6b52; border-radius: 999px; padding: 4px 14px; }
.status button {
  font: inherit; font-weight: 800; color: var(--ink); background: var(--gold); border: 0; border-radius: 999px;
  padding: 5px 16px; cursor: pointer;
}
.status button:hover { background: #f1c46b; }
.status button:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(16px, 3vw, 32px); padding: 8px 0; }

.gift {
  background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer;
  display: block; width: 100%; min-width: 0; -webkit-tap-highlight-color: transparent;
}
.gift:nth-child(4n+1) { --wrap: #b81f2a; --wrap-dark: #8f1520; --rib: #f0c15a; }
.gift:nth-child(4n+2) { --wrap: #1f6b4a; --wrap-dark: #17523a; --rib: #d6303a; }
.gift:nth-child(4n+3) { --wrap: #efe2c8; --wrap-dark: #d6c4a0; --rib: #b81f2a; }
.gift:nth-child(4n+4) { --wrap: #d8a437; --wrap-dark: #b5841f; --rib: #1f6b4a; }

.stage { position: relative; display: block; aspect-ratio: 1 / 1.08; max-width: 100%; }
.gift:focus-visible .stage { outline: 3px solid var(--gold); outline-offset: 6px; border-radius: 12px; }

.base {
  position: absolute; left: 7%; right: 7%; bottom: 0; height: 66%; background: var(--wrap); border-radius: 6px;
  box-shadow: inset -12px 0 0 rgba(0,0,0,.12), 0 14px 18px rgba(0,0,0,.4);
  transition: opacity .35s ease .15s, transform .5s ease;
}
.base::after, .lid::after {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 16%; transform: translateX(-50%); background: var(--rib);
}
.lid {
  position: absolute; left: 0; right: 0; top: 14%; height: 24%; background: var(--wrap-dark); border-radius: 6px;
  box-shadow: 0 6px 10px rgba(0,0,0,.3); transform-origin: 15% 100%;
  transition: transform .7s cubic-bezier(.3, 1.3, .5, 1), opacity .45s ease .1s;
}
.bow {
  position: absolute; left: 50%; top: -46%; width: 46%; height: 56%; transform: translateX(-50%); z-index: 1;
  background: radial-gradient(circle at 50% 100%, var(--rib) 0 13%, transparent 14%);
}
.bow::before, .bow::after {
  content: ""; position: absolute; bottom: 4%; width: 46%; height: 72%; border: 6px solid var(--rib); background: transparent;
}
.bow::before { left: 2%; border-radius: 70% 20% 70% 20%; transform: rotate(-22deg); }
.bow::after { right: 2%; border-radius: 20% 70% 20% 70%; transform: rotate(22deg); }

@media (hover: hover) {
  .gift[aria-pressed="false"]:hover .lid { transform: translateY(-8px) rotate(-3deg); }
  .gift[aria-pressed="false"]:hover .base { transform: translateY(2px); }
}

.reveal {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--cream); color: var(--ink); border-radius: 14px; padding: 18px 10px 12px;
  text-align: center; opacity: 0; transform: scale(.6) rotate(-4deg); pointer-events: none;
  box-shadow: 0 16px 28px rgba(0,0,0,.45);
  transition: opacity .4s ease .2s, transform .7s cubic-bezier(.3, 1.5, .5, 1) .2s;
}
.reveal::before {
  content: ""; position: absolute; top: 6px; left: 50%; width: 10px; height: 10px; margin-left: -5px;
  border-radius: 50%; background: var(--night);
}
.reveal img { flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; mix-blend-mode: multiply; }
.reveal .name { font-weight: 800; font-size: clamp(.82rem, 2.8vw, 1rem); line-height: 1.15; text-wrap: balance; }
.reveal .cat { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--red); font-weight: 800; }

.gift[aria-pressed="true"] .lid { transform: translate(-28%, -110%) rotate(-26deg); opacity: 0; }
.gift[aria-pressed="true"] .base { opacity: 0; transform: scale(.88); transition-delay: 0s; }
.gift[aria-pressed="true"] .reveal { opacity: 1; transform: none; pointer-events: auto; }

.spark {
  position: absolute; left: 50%; top: 45%; width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  pointer-events: none; z-index: 3; animation: burst .9s ease-out forwards;
}
@keyframes burst { from { transform: translate(0,0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

.finale { max-width: 560px; margin: 40px auto 0; display: flex; flex-direction: column; gap: 60px; }
.gift.big { --wrap: #b81f2a; --wrap-dark: #8f1520; --rib: #f0c15a; }
.big .stage { aspect-ratio: 2 / 1; }
.big .bow { width: 22%; height: 130%; top: -105%; }
.big .bow::before, .big .bow::after { border-width: 8px; }
.big .reveal { justify-content: center; padding: 18px 16px; }
.big .thanks { font-family: var(--font-display); font-size: clamp(2rem, 8vw, 3.6rem); line-height: 1; color: var(--red); text-wrap: balance; }

.gift.big.alt { --wrap: #1f6b4a; --wrap-dark: #17523a; --rib: #d6303a; }
.big.alt .reveal { gap: 4px; }
.big.alt .art { flex: 1 1 0; min-height: 0; width: 100%; }
.big.alt .thanks { font-size: clamp(1.25rem, 4.8vw, 1.9rem); color: #17523a; }

/* Last gift: gold-trimmed wrapping, bigger bow, glow, twinkles and a Santa hat tag */
.big.star .stage { aspect-ratio: 1.7 / 1; }
.big.star .stage::before {
  content: ""; position: absolute; inset: -16% 0 -8%; pointer-events: none;
  background: radial-gradient(ellipse at 50% 55%, rgba(230,176,75,.38), transparent 68%);
  animation: glow 3.2s ease-in-out infinite;
}
@keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.big.star .base {
  background: radial-gradient(circle at 12px 12px, rgba(240,193,90,.6) 2px, transparent 2.6px) 0 0 / 24px 24px, var(--wrap);
}
.big.star .lid {
  background: radial-gradient(circle at 12px 12px, rgba(240,193,90,.5) 2px, transparent 2.6px) 0 0 / 24px 24px, var(--wrap-dark);
}
.big.star .base::after, .big.star .lid::after {
  width: 14%; background: linear-gradient(90deg, #c8942f, #f8de92 50%, #c8942f);
}
.big.star .bow { width: 26%; }
.big.star .bow::before, .big.star .bow::after { border-color: #f0c15a; }
.big.star .bow { background: radial-gradient(circle at 50% 100%, #f0c15a 0 14%, transparent 15%); }
.big.star .tail {
  position: absolute; top: 92%; width: 17%; height: 52%; background: linear-gradient(180deg, #f0c15a, #c8942f);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
}
.big.star .tail.l { left: 24%; transform: rotate(14deg); }
.big.star .tail.r { right: 24%; transform: rotate(-14deg); }
.tw {
  position: absolute; width: 18px; height: 18px; background: #f8de92; z-index: 2; pointer-events: none;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: tw 2.2s ease-in-out infinite; transition: opacity .3s ease;
}
.tw.t1 { left: 3%; top: 16%; }
.tw.t2 { right: 4%; top: 8%; width: 14px; height: 14px; animation-delay: .6s; }
.tw.t3 { right: 2%; bottom: 14%; animation-delay: 1.1s; }
.tw.t4 { left: 2%; bottom: 20%; width: 12px; height: 12px; animation-delay: 1.6s; }
@keyframes tw { 0%, 100% { transform: scale(.5); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }
.gift[aria-pressed="true"] .tw { opacity: 0; animation: none; }
.big.star .reveal {
  gap: 2px; padding: 18px 14px 14px;
  background: radial-gradient(ellipse at 50% 0%, #fffaf0, var(--cream) 72%);
  box-shadow: inset 0 0 0 5px #f7eddb, inset 0 0 0 7px var(--gold), 0 16px 28px rgba(0,0,0,.45);
}
.big.star .reveal::before { display: none; }
.big.star .art { flex: 1 1 0; min-height: 0; width: 100%; }
.big.star .thanks { font-size: clamp(1.9rem, 8vw, 3.4rem); text-shadow: 0 2px 0 rgba(230,176,75,.55); }
.big.star .thanks::after {
  content: ""; display: block; height: 2px; width: 70%; margin: 6px auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
@media (prefers-reduced-motion: reduce) {
  .big.star .stage::before, .tw { animation: none; }
}

.merry { text-align: center; margin: 36px 0 0; font-family: var(--font-display); font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--gold); text-wrap: balance; }
.merry small { display: block; font-family: var(--font-body); font-size: 1rem; color: var(--mist); margin-top: 4px; }

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 16px; max-width: 520px; margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  .lights span { animation: none; }
  .lid, .base, .reveal { transition-duration: .01s; transition-delay: 0s; }
  .spark { display: none; }
}
</style>

var grid = document.getElementById("grid");
var countEl = document.getElementById("count");
document.getElementById("total").textContent = GIFTS.length;
var merry = document.getElementById("merry");

(function lights() {
  var wrap = document.getElementById("lights");
  var colors = ["#ff4a4a", "#ffd25a", "#4fd18b", "#f7eddb"];
  for (var i = 0; i < 16; i++) {
    var s = document.createElement("span");
    s.style.setProperty("--c", colors[i % 4]);
    s.style.setProperty("--d", (i * 0.35).toFixed(2) + "s");
    wrap.appendChild(s);
  }
})();

function sparkle(stage, n) {
  n = n || 10;
  var colors = n > 10 ? ["#e6b04b", "#f7eddb", "#c9232d", "#4fd18b"] : ["#e6b04b", "#f7eddb"];
  for (var i = 0; i < n; i++) {
    var s = document.createElement("span");
    s.className = "spark";
    var a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    var r = n > 10 ? 50 + Math.random() * 90 : 60 + Math.random() * 50;
    s.style.setProperty("--dx", Math.cos(a) * r + "px");
    s.style.setProperty("--dy", Math.sin(a) * r + "px");
    s.style.background = colors[i % colors.length];
    stage.appendChild(s);
    setTimeout(function (el) { el.remove(); }, 950, s);
  }
}

function refresh() {
  var open = grid.querySelectorAll('.gift[aria-pressed="true"]').length;
  countEl.textContent = open;
  merry.hidden = open !== GIFTS.length;
}

GIFTS.forEach(function (g, i) {
  var b = document.createElement("button");
  b.type = "button";
  b.className = "gift";
  b.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-label", "Ouvrir le cadeau " + (i + 1));
  b.innerHTML =
    '<span class="stage">' +
    '<span class="base"></span>' +
    '<span class="lid"><span class="bow"></span></span>' +
    '<span class="reveal"><img alt="" src="' + g.img + '"><span class="name"></span><span class="cat"></span></span>' +
    '</span>';
  b.querySelector(".name").textContent = g.name;
  b.querySelector(".cat").textContent = g.cat;
  b.querySelector("img").alt = g.name;
  b.addEventListener("click", function () {
    var on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", on ? "Cadeau ouvert : " + g.name + ". Refermer" : "Ouvrir le cadeau " + (i + 1));
    if (on) sparkle(b.querySelector(".stage"));
    refresh();
  });
  grid.appendChild(b);
});

var bigs = Array.prototype.slice.call(document.querySelectorAll(".big"));
function setBig(b, on) {
  b.setAttribute("aria-pressed", String(on));
  b.setAttribute("aria-label", on ? b.getAttribute("data-open") : b.getAttribute("data-closed"));
}
bigs.forEach(function (b) {
  b.addEventListener("click", function () {
    var on = b.getAttribute("aria-pressed") !== "true";
    setBig(b, on);
    if (on) sparkle(b.querySelector(".stage"), b.classList.contains("star") ? 30 : 10);
  });
});

document.getElementById("reset").addEventListener("click", function () {
  bigs.forEach(function (b) { setBig(b, false); });
  grid.querySelectorAll(".gift").forEach(function (b, i) {
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", "Ouvrir le cadeau " + (i + 1));
  });
  refresh();
});

(function snow() {
  var c = document.getElementById("snow");
  var ctx = c.getContext("2d");
  var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var speed = calm ? 0.4 : 1;
  var w = 0, h = 0, flakes = [];
  function dims() { return [c.clientWidth || window.innerWidth, c.clientHeight || window.innerHeight]; }
  function size() {
    var d = dims(), dpr = window.devicePixelRatio || 1;
    w = d[0]; h = d[1];
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes.forEach(function (f) {
      if (f.x > w) f.x = Math.random() * w;
      if (f.y > h) f.y = Math.random() * h;
    });
  }
  size();
  for (var i = 0; i < 120; i++) {
    var near = Math.random() < 0.3;
    flakes.push({
      x: Math.random() * w, y: Math.random() * h,
      r: near ? 2.6 + Math.random() * 1.8 : 1.2 + Math.random() * 1.6,
      v: near ? 0.9 + Math.random() * 0.8 : 0.35 + Math.random() * 0.5,
      a: near ? 0.95 : 0.55 + Math.random() * 0.3,
      p: Math.random() * 6.28
    });
  }
  function frame(t) {
    var d = dims();
    if (d[0] !== w || d[1] !== h) size();
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#f7eddb";
    flakes.forEach(function (f) {
      f.y += f.v * speed;
      f.x += Math.sin(t / 1500 + f.p) * 0.4 * speed;
      if (f.y > h + 6) { f.y = -6; f.x = Math.random() * w; }
      ctx.globalAlpha = f.a;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
